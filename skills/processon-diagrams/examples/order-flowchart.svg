<svg xmlns="http://www.w3.org/2000/svg" width="920" height="865" viewBox="0 0 920 865">
<style>text{font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC',-apple-system,'Segoe UI',Arial,sans-serif;fill:#262626;}</style>
<rect width="920" height="865" fill="#FFFFFF"/>
<!-- 顶部标题 -->
<rect x="40.0" y="24.0" width="840.0" height="44.0" rx="0" fill="#90DDDB" stroke="#4D4D4D" stroke-width="1"/>
<text x="460.0" y="52.0" font-size="17" text-anchor="middle" font-weight="bold">订单支付与异常处理流程图</text>
